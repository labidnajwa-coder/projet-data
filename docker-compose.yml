version: '3.8'

# ================================================================
#  NEWS-INSIGHT: SIMPLE ARCHITECTURE
# ================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: 'fMnCBmJQOCEqxVMTvZB6bK5I9Xw8GuhE_B5KVQ3fA4g='
    AIRFLOW__WEBSERVER__SECRET_KEY: 'news-insight-secret-key'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    _PIP_ADDITIONAL_REQUIREMENTS: 'minio beautifulsoup4 lxml psycopg2-binary kafka-python feedparser'
  env_file:
    - .env
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./scraper:/opt/airflow/scraper
  depends_on:
    airflow-db:
      condition: service_healthy
  networks:
    - news-network

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-service
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news-network

  message-queue:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-message-queue
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://message-queue:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
    networks:
      - news-network

  data-lake-storage:
    image: minio/minio:latest
    container_name: minio-data-lake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
    networks:
      - news-network

  storage-init:
    image: minio/mc:latest
    container_name: setup-buckets
    depends_on:
      data-lake-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://data-lake-storage:9000 ${STORAGE_USER} ${STORAGE_PASSWORD};
      mc mb --ignore-existing local/raw-news-data;
      mc mb --ignore-existing local/cleaned-news-data;
      mc mb --ignore-existing local/final-analytics-data;
      exit 0;
      "
    networks:
      - news-network

  analytics-db:
    image: postgres:15-alpine
    container_name: postgres-warehouse
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dw-data:/var/lib/postgresql/data
      - ./data-warehouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
    networks:
      - news-network

  airflow-db:
    image: postgres:15-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
    networks:
      - news-network

  pipeline-init:
    <<: *airflow-common
    container_name: airflow-setup
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname News \
          --lastname Insight \
          --role Admin \
          --email admin@newsinsight.com \
          --password admin
    restart: "no"

  pipeline-web-ui:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      pipeline-init:
        condition: service_completed_successfully

  pipeline-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      pipeline-init:
        condition: service_completed_successfully

