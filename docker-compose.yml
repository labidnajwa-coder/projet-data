  bi-tool:
    image: apache/superset:3.1.0
    container_name: superset-bi
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: 'news-insight-secret'
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname News --lastname Insight --email admin@newsinsight.com --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "
    networks:
      - news-network

volumes:
  zk-data:
  zk-logs:
  kafka-data:
  minio-data:
  dw-data:
  airflow-db-data:

networks:
  news-network:
    driver: bridge